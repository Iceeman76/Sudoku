version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /Sudoku
      - /SudokuTests
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Stockholm
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns:
          - "*"
